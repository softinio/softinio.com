<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="200" height="200" role="img" aria-labelledby="t">
  <title id="t">verdict4s</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2F5E"/>
      <stop offset="1" stop-color="#151833"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B5E"/>
      <stop offset="0.5" stop-color="#E0332B"/>
      <stop offset="1" stop-color="#A51D17"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E24A40"/>
      <stop offset="0.5" stop-color="#B8231C"/>
      <stop offset="1" stop-color="#7E140F"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7C66B"/>
      <stop offset="1" stop-color="#C98A2E"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C66B"/>
      <stop offset="1" stop-color="#B7781F"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- confetti -->
  <g opacity="0.9">
    <circle cx="84" cy="96" r="7" fill="#FFD166"/>
    <circle cx="430" cy="440" r="6" fill="#FF6B5E"/>
    <rect x="404" y="86" width="14" height="14" rx="3" fill="#7BDFF2" transform="rotate(20 411 93)"/>
    <rect x="66" y="210" width="12" height="12" rx="3" fill="#FF6B5E" transform="rotate(-15 72 216)"/>
    <circle cx="448" cy="250" r="5" fill="#7BDFF2"/>
  </g>

  <!-- sound block -->
  <ellipse cx="170" cy="418" rx="104" ry="26" fill="#000" opacity="0.25"/>
  <path d="M74 370 v34 a96 24 0 0 0 192 0 v-34 z" fill="url(#block)"/>
  <ellipse cx="170" cy="370" rx="96" ry="24" fill="#FFDE93"/>
  <ellipse cx="170" cy="370" rx="64" ry="14" fill="#F2B84E" opacity="0.6"/>

  <!-- impact sparks -->
  <g stroke="#FFD166" stroke-width="12" stroke-linecap="round">
    <path d="M60 318 l-26 -18"/>
    <path d="M86 290 l-12 -30"/>
    <path d="M52 356 l-30 2"/>
  </g>

  <!-- gavel -->
  <g transform="translate(262 236) rotate(-38)">
    <!-- handle -->
    <rect x="-17" y="30" width="34" height="238" rx="17" fill="url(#wood)"/>
    <rect x="-17" y="228" width="34" height="40" rx="17" fill="#E24A40"/>
    <!-- head: three layers -->
    <rect x="-130" y="-52" width="68" height="104" rx="22" fill="url(#cap)"/>
    <rect x="62" y="-52" width="68" height="104" rx="22" fill="url(#cap)"/>
    <rect x="-70" y="-60" width="140" height="120" rx="26" fill="url(#band)"/>
    <!-- shine -->
    <rect x="-118" y="-40" width="40" height="12" rx="6" fill="#fff" opacity="0.35"/>
    <rect x="-56" y="-48" width="70" height="12" rx="6" fill="#fff" opacity="0.25"/>
    <!-- face -->
    <g transform="rotate(38)">
      <circle cx="-20" cy="-6" r="15" fill="#fff"/>
      <circle cx="22" cy="-6" r="15" fill="#fff"/>
      <circle cx="-25" cy="-1" r="7" fill="#151833"/>
      <circle cx="17" cy="-1" r="7" fill="#151833"/>
      <circle cx="-22" cy="-4" r="2.5" fill="#fff"/>
      <circle cx="20" cy="-4" r="2.5" fill="#fff"/>
      <path d="M-14 20 q15 14 30 0" fill="none" stroke="#151833" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-38" cy="16" r="6" fill="#FF9A8F" opacity="0.8"/>
      <circle cx="38" cy="16" r="6" fill="#FF9A8F" opacity="0.8"/>
    </g>
  </g>

  <!-- verdict badge -->
  <circle cx="392" cy="372" r="58" fill="#2EC4B6"/>
  <circle cx="392" cy="372" r="58" fill="none" stroke="#fff" stroke-width="8"/>
  <path d="M364 374 l20 20 l36 -40" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
