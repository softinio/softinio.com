{{ define "main" }}
  <div class="page-header">
    <h1>{{ .Title }}</h1>
  </div>

  <link href="/pagefind/pagefind-ui.css" rel="stylesheet" />
  <script src="/pagefind/pagefind-ui.js"></script>

  <div id="search"></div>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      new PagefindUI({
        element: '#search',
        showSubResults: true,
        showImages: false
      });
    });
  </script>
{{ end }}
