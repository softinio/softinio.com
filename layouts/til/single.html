{{ define "main" }}
  <div class="article-header">
    {{- with .Params.til_category }}
    <div class="til-label">{{ . }}</div>
    {{- else }}
      {{- with .Params.tags }}
      <div class="til-label">{{ index . 0 }}</div>
      {{- end }}
    {{- end }}
    {{- if not .Date.IsZero }}
    <div class="post-date">{{ .Date.Format "2 January 2006" }}</div>
    {{- end }}
    <h1>{{ .Title }}</h1>
  </div>

  <div class="article-body">
    {{ .Content }}
  </div>
{{ end }}
