{{- $id := .Get "id" | default (.Get 0) -}}
<div style="position: relative; padding-bottom: 56.25%; margin-bottom: 0.25rem; height: 0; overflow: hidden;">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ $id }}"
          title="YouTube Video"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
          allowfullscreen>
  </iframe>
</div>
<p class="video-fallback"><a href="https://www.youtube.com/watch?v={{ $id }}" target="_blank" rel="noopener">▶ Watch on YouTube</a></p>
