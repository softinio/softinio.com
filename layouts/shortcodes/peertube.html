{{ if .IsNamedParams -}}
{{- $id := .Get "id" -}}
<div style="position: relative; padding-bottom: 56.25%; margin-bottom: 0.25rem; height: 0; overflow: hidden;">
<iframe sandbox="allow-same-origin allow-scripts allow-popups" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;"
    src="https://watch.softinio.com/videos/embed/{{ $id }}?{{ with .Get "title" }}title={{ . }}{{ else }}title=0{{ end }}&{{ with .Get "warning" }}warningTitle={{ . }}{{ else }}warningTitle=0{{ end }}{{ with .Get "subtitle" }}&subtitle={{ . }}{{ end }}&peertubeLink=0" allowfullscreen>
</iframe>
</div>
<p class="video-fallback"><a href="https://watch.softinio.com/w/{{ $id }}" target="_blank" rel="noopener">▶ Watch on PeerTube</a></p>
{{- else -}}
{{- $id := .Get 1 -}}
<div style="position: relative; padding-bottom: 56.25%; margin-bottom: 0.25rem; height: 0; overflow: hidden;">
<iframe sandbox="allow-same-origin allow-scripts allow-popups" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;"
    src="https://watch.softinio.com/videos/embed/{{ $id }}?title=0&warningTitle=0&peertubeLink=0" title="Peertube Video" allowfullscreen>
</iframe>
</div>
<p class="video-fallback"><a href="https://watch.softinio.com/w/{{ $id }}" target="_blank" rel="noopener">▶ Watch on PeerTube</a></p>
{{- end }}
