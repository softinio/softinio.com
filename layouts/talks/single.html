{{ define "main" }}
  <div class="article-header">
    {{- if not .Date.IsZero }}
    <div class="post-date">{{ .Date.Format "2 January 2006" }}</div>
    {{- end }}
    <h1>{{ .Title }}</h1>
    {{- with .Params.tags }}
    <div class="post-tags">
      {{- range . }}
      <a href="{{ "tags/" | relURL }}{{ . | urlize }}/" class="tag">{{ . }}</a>
      {{- end }}
    </div>
    {{- end }}
  </div>

  <div class="article-body">
    {{ .Content }}
  </div>
{{ end }}
